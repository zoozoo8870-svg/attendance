<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>เช็คชื่อออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --brand:#2563eb; --brand-dark:#1e3a8a; --sky:#0ea5e9; --brand-soft:#dbeafe;
    --ok:#16a34a; --ok-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef3c7; --bad:#dc2626; --bad-soft:#fee2e2;
    --card:#fff; --text:#0f1e3d; --muted:#64748b; --line:#dbe4f3;
    --radius:18px; --shadow:0 1px 2px rgba(30,64,175,.06),0 6px 18px rgba(30,64,175,.08);
    --grad:linear-gradient(135deg,#2563eb,#0ea5e9);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(180deg,#dbe8ff 0,#eef4ff 280px,#f5f8ff 100%) fixed;color:var(--text);font-size:16px;line-height:1.45;min-height:100vh}
  button,input,select{font-family:inherit;font-size:16px}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px calc(100px + env(safe-area-inset-bottom))}
  .hidden{display:none!important}

  /* Header */
  header{position:sticky;top:0;z-index:20;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;border-radius:0 0 24px 24px;box-shadow:0 8px 24px rgba(30,64,175,.28);
    background:radial-gradient(circle at 92% -20%,rgba(125,211,252,.6) 0,transparent 45%),radial-gradient(circle at -10% 120%,rgba(96,165,250,.45) 0,transparent 40%),linear-gradient(135deg,#1e40af,#2563eb 55%,#0ea5e9)}
  .hd{max-width:560px;margin:0 auto}
  .hd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .hd h1{font-size:20px;margin:0;font-weight:700;line-height:1.25}
  .hd .date{font-size:14px;opacity:.92;margin-top:2px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:5px 11px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(6px)}
  .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}.dot.on{background:#4ade80}.dot.busy{background:#facc15}.dot.err{background:#f87171}
  .prog{margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px}
  .prog-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
  .prog-row b{font-size:18px}
  .bar{height:10px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#bae6fd,#fff);border-radius:999px;transition:width .5s;box-shadow:0 0 10px rgba(255,255,255,.6)}

  /* Common */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:14px}
  .card h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .muted{color:var(--muted)} .small{font-size:13px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--grad);color:#fff;min-height:48px;width:100%;box-shadow:0 4px 12px rgba(37,99,235,.25)}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid #93c5fd;box-shadow:none}
  .btn.gray{background:#e8effb;color:#1e3a8a;box-shadow:none}
  .btn.danger{background:var(--bad);box-shadow:none}
  .btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px;width:auto}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn.google{background:#fff;color:#1f2937;border:1.5px solid var(--line);box-shadow:var(--shadow)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .stack>*+*{margin-top:10px}
  input[type=text],input[type=date],select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--text);outline:none}
  input:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.2)}
  label.lb{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
  .note{border-radius:12px;padding:10px 12px;font-size:14px}
  .note.warn{background:var(--warn-soft);color:#92400e}
  .note.info{background:#eff6ff;color:#1e40af}
  .note.bad{background:var(--bad-soft);color:#991b1b}

  /* Search, chips */
  .search{position:relative;margin-top:14px}
  .search input{padding-left:44px;height:52px;border-radius:16px;box-shadow:var(--shadow);border-color:#fff}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--brand)}
  .chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
  .chip.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.25)}

  .me{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ecfdf5,#eff6ff);border:1.5px solid #86efac;border-radius:var(--radius);padding:12px 14px;margin-top:14px}
  .me .big{font-size:28px}.me b{display:block}

  /* List */
  .group-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#1e40af;margin:18px 4px 8px}
  .group-title::before{content:'';width:4px;height:16px;border-radius:4px;background:linear-gradient(#2563eb,#38bdf8)}
  .group-title span{margin-left:auto;font-weight:600;color:var(--muted);background:#fff;border-radius:999px;padding:1px 9px;font-size:12px}
  .person{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;width:100%;text-align:left;color:inherit;transition:border-color .2s,background .2s}
  .person:active{transform:scale(.99)}
  .person.done{background:#f0fdf4;border-color:#bbf7d0}
  .av{flex:0 0 44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:linear-gradient(135deg,#dbeafe,#e0f2fe);color:#1d4ed8}
  .person.done .av{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
  .pinfo{flex:1;min-width:0}
  .pname{font-weight:600;line-height:1.3;word-break:break-word}
  .pcomp{font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
  .tag{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
  .tag.ok{background:var(--ok);color:#fff}
  .tag.wait{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
  .tag.off{background:#f1f5f9;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .skeleton{height:68px;border-radius:16px;margin-bottom:8px;background:linear-gradient(90deg,#e8effb 25%,#f5f8ff 50%,#e8effb 75%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}

  /* Summary */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--shadow);border-top:4px solid #60a5fa}
  .stat b{display:block;font-size:30px;line-height:1.1;color:#1d4ed8}
  .stat span{font-size:13px;color:var(--muted)}
  .stat.ok{border-top-color:#22c55e}.stat.ok b{color:var(--ok)}
  .stat.bad{border-top-color:#f87171}.stat.bad b{color:var(--bad)}
  .sline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .sline:last-child{border-bottom:0}
  .sline .n{min-width:0;flex:1}
  .sline .n div:first-child{font-weight:600}
  .sline .t{white-space:nowrap;color:var(--ok);font-weight:600}
  .sline .t.x{color:var(--bad)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

  /* Admin */
  .user{display:flex;align-items:center;gap:12px}
  .user img,.user .uav{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brand)}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:#1d4ed8}

  /* Tabs */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(30,64,175,.06)}
  .tabs-in{max-width:560px;margin:0 auto;display:flex}
  .tab{position:relative;flex:1;border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
  .tab svg{width:24px;height:24px}
  .tab.active{color:var(--brand)}
  .tab.active::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#2563eb,#38bdf8)}
  .tab .lock{position:absolute;top:6px;right:calc(50% - 22px);font-size:10px}

  /* Modal, toast */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(15,30,61,.5);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center}
  .modal.show{display:flex;animation:fade .15s}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out;max-height:90vh;overflow:auto}
  .sheet .grab{width:42px;height:5px;background:#cbd5e1;border-radius:9px;margin:-8px auto 14px}
  .sheet h3{margin:0 0 4px;font-size:20px;text-align:center}
  .sheet .sub{text-align:center;color:var(--muted);margin-bottom:16px}
  .bigav{width:72px;height:72px;font-size:30px;margin:0 auto 10px;flex:none}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1e3a8a;color:#fff;padding:11px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="hd-top">
      <div>
        <h1 id="evName">เช็คชื่อผู้เข้าอบรม</h1>
        <div class="date" id="evDate">-</div>
      </div>
      <div class="pill"><span class="dot" id="syncDot"></span><span id="syncTxt">กำลังเชื่อมต่อ…</span></div>
    </div>
    <div class="prog">
      <div class="prog-row"><span>มาแล้ว <b id="cntIn">0</b> / <span id="cntAll">0</span> คน</span><span id="cntPct">0%</span></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ===== เช็คชื่อ ===== -->
  <section id="page-check">
    <div id="meBox"></div>
    <div id="dateNote"></div>
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" id="q" placeholder="พิมพ์ค้นหาชื่อ หรือบริษัท" autocomplete="off">
    </div>
    <div class="chips" id="chips">
      <button class="chip active" data-f="all">ทั้งหมด</button>
      <button class="chip" data-f="wait">ยังไม่มา</button>
      <button class="chip" data-f="done">มาแล้ว</button>
    </div>
    <div class="list" id="list">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </section>

  <!-- ===== สรุป (แอดมิน) ===== -->
  <section id="page-sum" class="hidden">
    <div id="sumLocked"></div>
    <div id="sumBody" class="hidden">
      <div class="stats">
        <div class="stat"><b id="sAll">0</b><span>ทั้งหมด</span></div>
        <div class="stat ok"><b id="sIn">0</b><span>มาแล้ว</span></div>
        <div class="stat bad"><b id="sOut">0</b><span>ยังไม่มา</span></div>
      </div>
      <div class="card stack">
        <div>
          <label class="lb" for="sumDate">ดูข้อมูลวันที่</label>
          <input type="date" id="sumDate">
        </div>
        <div class="row">
          <button class="btn" id="btnCopy">📋 คัดลอกสรุป</button>
          <button class="btn ghost" id="btnCsv">⬇️ ไฟล์ Excel</button>
        </div>
      </div>
      <div class="card">
        <h2>❌ ยังไม่มา (<span id="sOut2">0</span>)</h2>
        <div id="sumOut"></div>
      </div>
      <div class="card">
        <h2>✅ มาแล้ว (<span id="sIn2">0</span>)</h2>
        <div id="sumIn"></div>
      </div>
    </div>
  </section>

  <!-- ===== แอดมิน ===== -->
  <section id="page-admin" class="hidden">
    <div id="adminBox"></div>

    <div id="adminBody" class="hidden">
      <div class="card stack">
        <h2>📝 ชื่องาน</h2>
        <input type="text" id="setName" placeholder="เช่น อบรม AI สร้างเว็บแอป รุ่นที่ 1">
        <button class="btn" id="btnSaveName">บันทึกชื่องาน</button>
      </div>

      <div class="card stack">
        <h2>➕ เพิ่มรายชื่อ</h2>
        <div class="row">
          <select id="addTitle" style="flex:0 0 110px">
            <option value="">คำนำหน้า</option><option>นาย</option><option>นาง</option><option>นางสาว</option>
          </select>
          <input type="text" id="addName" placeholder="ชื่อ-นามสกุล">
        </div>
        <input type="text" id="addComp" placeholder="บริษัท / หน่วยงาน">
        <button class="btn" id="btnAdd">เพิ่มรายชื่อ</button>
      </div>

      <div class="card">
        <h2>👥 รายชื่อทั้งหมด (<span id="memCount">0</span>)</h2>
        <p class="small muted" style="margin-top:0">“ซ่อน” = ไม่แสดงในหน้าเช็คชื่อ แต่ยังเก็บประวัติไว้</p>
        <div id="memList"></div>
      </div>
    </div>
  </section>
</main>

<nav class="tabs">
  <div class="tabs-in">
    <button class="tab active" data-p="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      เช็คชื่อ
    </button>
    <button class="tab" data-p="sum">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      สรุป<span class="lock" id="lock1">🔒</span>
    </button>
    <button class="tab" data-p="admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
      ผู้ดูแล<span class="lock" id="lock2">🔒</span>
    </button>
  </div>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ⚙️ ตั้งค่าการเชื่อมต่อ Supabase
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://xbdndbcqsjaudpapfyhi.supabase.co',
  SUPABASE_KEY: 'sb_publishable_g6LfXo1bULT_cpah2mXEDg_2rUaGZsL',   // คีย์สาธารณะ (ปลอดภัยที่จะอยู่ในหน้าเว็บ)
  ADMIN_EMAIL:  'zoozoo8870@gmail.com',                               // อีเมลผู้ดูแล (ฐานข้อมูลตรวจซ้ำอีกชั้น)
  TZ: 'Asia/Bangkok'
};

/* =====================================================================
   ระบบภายใน
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').replace(/\s+/g, ' ').trim();
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const todayKey = () => new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG.TZ, year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
const thaiDate = key => { const [y,m,d] = key.split('-').map(Number); return new Date(Date.UTC(y, m-1, d, 5)).toLocaleDateString('th-TH', { timeZone: CONFIG.TZ, weekday:'long', day:'numeric', month:'long', year:'numeric' }); };
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString('th-TH', { timeZone: CONFIG.TZ, hour:'2-digit', minute:'2-digit' }) : '';
const fmtTimeSec = iso => iso ? new Date(iso).toLocaleTimeString('th-TH', { timeZone: CONFIG.TZ, hour:'2-digit', minute:'2-digit', second:'2-digit' }) : '';

let sb = null;
const S = {
  members: [],          // {id,title,name,company,active}
  checks: {},           // member_id -> {id, checked_at}
  eventName: 'เช็คชื่อผู้เข้าอบรม',
  date: todayKey(),     // วันที่ที่แสดง
  filter: 'all',
  user: null,           // ผู้ใช้ที่ล็อกอิน
  loaded: false,
  online: false
};
const isAdmin = () => !!(S.user && String(S.user.email || '').toLowerCase() === CONFIG.ADMIN_EMAIL.toLowerCase());
const activeMembers = () => S.members.filter(m => m.active);

/* ---------- Modal / Toast ---------- */
function openModal(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
function setSync(state, text){ const d = $('#syncDot'); d.className = 'dot' + (state ? ' ' + state : ''); $('#syncTxt').textContent = text; }

/* ---------- โหลดข้อมูล ---------- */
async function loadAll(){
  try{
    const [m, c, s] = await Promise.all([
      sb.from('members').select('id,title,name,company,active').order('company').order('name'),
      sb.from('checkins').select('id,member_id,checked_at').eq('event_date', S.date),
      sb.from('app_settings').select('key,value')
    ]);
    if(m.error) throw m.error; if(c.error) throw c.error; if(s.error) throw s.error;
    S.members = m.data || [];
    S.checks = {};
    (c.data || []).forEach(r => S.checks[r.member_id] = { id:r.id, checked_at:r.checked_at });
    (s.data || []).forEach(r => { if(r.key === 'event_name' && r.value) S.eventName = r.value; });
    S.loaded = true; S.online = true;
    setSync('on', 'ออนไลน์');
  }catch(e){
    console.error(e);
    S.online = false;
    setSync('err', 'ออฟไลน์');
    if(!S.loaded) $('#list').innerHTML = `<div class="card"><div class="note bad">เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ต แล้วลองใหม่</div><button class="btn" style="margin-top:10px" onclick="loadAll()">ลองใหม่</button></div>`;
  }
  render();
}

/* ---------- Render ---------- */
function renderHeader(){
  const all = activeMembers();
  const n = all.filter(m => S.checks[m.id]).length;
  const pct = all.length ? Math.round(n * 100 / all.length) : 0;
  $('#evName').textContent = S.eventName;
  $('#evDate').textContent = thaiDate(S.date);
  $('#cntIn').textContent = n; $('#cntAll').textContent = all.length;
  $('#cntPct').textContent = pct + '%'; $('#barFill').style.width = pct + '%';
  document.title = 'เช็คชื่อ ' + n + '/' + all.length;
  $('#lock1').classList.toggle('hidden', isAdmin());
  $('#lock2').classList.toggle('hidden', isAdmin());
}

function renderCheck(){
  const meId = LS.get('att_me', null);
  const meM = S.members.find(m => m.id === meId);
  const meC = meM && S.checks[meM.id];
  $('#meBox').innerHTML = (meC && S.date === todayKey())
    ? `<div class="me"><div class="big">✅</div><div><b>${esc(meM.name)}</b><span class="small">เช็คชื่อเรียบร้อยแล้ว เวลา ${esc(fmtTime(meC.checked_at))} น.</span></div></div>` : '';
  $('#dateNote').innerHTML = S.date !== todayKey()
    ? `<div class="note warn" style="margin-top:14px">กำลังดูข้อมูลของ${esc(thaiDate(S.date))} (ไม่ใช่วันนี้) <a href="#" id="backToday">กลับไปวันนี้</a></div>` : '';
  const bt = $('#backToday'); if(bt) bt.onclick = e => { e.preventDefault(); setDate(todayKey()); };
  if(!S.loaded) return;

  const q = norm($('#q').value).toLowerCase();
  let list = activeMembers().filter(m => !q || (m.title + ' ' + m.name + ' ' + m.company).toLowerCase().includes(q));
  if(S.filter === 'wait') list = list.filter(m => !S.checks[m.id]);
  if(S.filter === 'done') list = list.filter(m => S.checks[m.id]);
  if(!list.length){
    $('#list').innerHTML = `<div class="empty">${q ? 'ไม่พบชื่อที่ค้นหา<br><span class="small">ถ้าไม่มีชื่อ แจ้งเจ้าหน้าที่ให้เพิ่มชื่อได้</span>' : (S.filter==='wait' ? '🎉 ทุกคนมาครบแล้ว' : 'ยังไม่มีข้อมูล')}</div>`;
    return;
  }
  const groups = {};
  list.forEach(m => { const g = m.company || 'อื่น ๆ'; (groups[g] = groups[g] || []).push(m); });
  let html = '';
  Object.keys(groups).sort((a,b) => a.localeCompare(b, 'th')).forEach(g => {
    const all = activeMembers().filter(m => (m.company || 'อื่น ๆ') === g);
    html += `<div class="group-title">${esc(g)}<span>${all.filter(m => S.checks[m.id]).length}/${all.length}</span></div>`;
    groups[g].forEach(m => {
      const c = S.checks[m.id];
      html += `<button class="person ${c ? 'done' : ''}" data-id="${m.id}">
        <div class="av">${c ? '✓' : esc(m.name.charAt(0))}</div>
        <div class="pinfo"><div class="pname">${esc((m.title ? m.title + ' ' : '') + m.name)}</div><div class="pcomp">${esc(m.company || '-')}</div></div>
        <div>${c ? `<span class="tag ok">✓ ${esc(fmtTime(c.checked_at))}</span>` : `<span class="tag wait">เช็คชื่อ</span>`}</div>
      </button>`;
    });
  });
  $('#list').innerHTML = html;
}

/* ---------- เช็คชื่อ ---------- */
function askCheck(id){
  const m = S.members.find(x => x.id === id); if(!m) return;
  const c = S.checks[id];
  if(c){
    openModal(`<div class="av bigav" style="background:var(--ok);color:#fff">✓</div>
      <h3>${esc(m.name)}</h3><div class="sub">${esc(m.company)}<br>เช็คชื่อแล้วเวลา <b>${esc(fmtTimeSec(c.checked_at))} น.</b></div>
      <div class="stack"><button class="btn gray" onclick="closeModal()">ปิด</button>
      ${isAdmin() ? `<button class="btn danger" onclick="undoCheck(${id})">ยกเลิกการเช็คชื่อ</button>` : '<p class="small muted" style="text-align:center;margin:6px 0 0">ถ้าเช็คชื่อผิด แจ้งเจ้าหน้าที่ให้ยกเลิกได้</p>'}</div>`);
    return;
  }
  if(S.date !== todayKey() && !isAdmin()){ toast('เช็คชื่อได้เฉพาะวันนี้'); return; }
  openModal(`<div class="av bigav">${esc(m.name.charAt(0))}</div>
    <h3>${esc((m.title ? m.title + ' ' : '') + m.name)}</h3>
    <div class="sub">${esc(m.company)}<br>${esc(thaiDate(S.date))}</div>
    <div class="note info small" style="margin-bottom:12px">กรุณาตรวจสอบว่าเป็นชื่อของคุณ ก่อนกดยืนยัน</div>
    <div class="stack">
      <button class="btn" id="mYes" style="font-size:18px;min-height:56px">✅ ยืนยันเช็คชื่อ</button>
      <button class="btn gray" onclick="closeModal()">ยกเลิก</button>
    </div>`);
  $('#mYes').onclick = () => doCheck(m);
}

async function doCheck(m){
  const btn = $('#mYes'); if(btn){ btn.disabled = true; btn.textContent = 'กำลังบันทึก…'; }
  const payload = (isAdmin() && S.date !== todayKey()) ? { member_id: m.id, event_date: S.date } : { member_id: m.id };
  const { data, error } = await sb.from('checkins').insert(payload).select('id,member_id,checked_at').single();
  closeModal();
  if(error){
    if(error.code === '23505'){ toast('ชื่อนี้เช็คชื่อไปแล้ว'); await loadAll(); return; }
    if(error.code === '42501'){ toast('เช็คชื่อไม่ได้ (เช็คได้เฉพาะวันนี้)'); return; }
    toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); console.error(error); return;
  }
  S.checks[m.id] = { id:data.id, checked_at:data.checked_at };
  if(!isAdmin()) LS.set('att_me', m.id);
  if(navigator.vibrate) navigator.vibrate(60);
  toast('เช็คชื่อสำเร็จ ✓ ' + fmtTime(data.checked_at) + ' น.');
  render();
}

async function undoCheck(memberId){
  const c = S.checks[memberId]; if(!c) return;
  const { error } = await sb.from('checkins').delete().eq('id', c.id);
  closeModal();
  if(error){ toast('ยกเลิกไม่สำเร็จ'); console.error(error); return; }
  delete S.checks[memberId];
  toast('ยกเลิกการเช็คชื่อแล้ว'); render();
}

/* ---------- แอดมิน: รายชื่อ ---------- */
function editMember(id){
  const m = S.members.find(x => x.id === id); if(!m) return;
  openModal(`<h3>แก้ไขรายชื่อ</h3><div class="sub">&nbsp;</div>
    <div class="stack">
      <select id="eTitle"><option value="">คำนำหน้า</option>${['นาย','นาง','นางสาว'].map(t => `<option ${m.title===t?'selected':''}>${t}</option>`).join('')}</select>
      <input type="text" id="eName" value="${esc(m.name)}" placeholder="ชื่อ-นามสกุล">
      <input type="text" id="eComp" value="${esc(m.company)}" placeholder="บริษัท / หน่วยงาน">
      <button class="btn" id="eSave">บันทึก</button>
      <button class="btn danger" id="eDel">ลบรายชื่อนี้ถาวร</button>
      <button class="btn gray" onclick="closeModal()">ยกเลิก</button>
    </div>`);
  $('#eSave').onclick = async () => {
    const name = norm($('#eName').value); if(!name) return toast('กรุณาใส่ชื่อ');
    const { error } = await sb.from('members').update({ title:$('#eTitle').value, name, company:norm($('#eComp').value) }).eq('id', id);
    if(error) return toast(error.code === '23505' ? 'มีชื่อนี้อยู่แล้ว' : 'บันทึกไม่สำเร็จ');
    closeModal(); toast('บันทึกแล้ว'); loadAll();
  };
  $('#eDel').onclick = () => {
    openModal(`<h3>ลบ “${esc(m.name)}” ?</h3><div class="sub">ประวัติการเช็คชื่อทั้งหมดของคนนี้จะถูกลบด้วย และกู้คืนไม่ได้<br>(ถ้าแค่ไม่อยากให้แสดง ใช้ปุ่ม “ซ่อน” แทน)</div>
      <div class="stack"><button class="btn danger" id="dYes">ลบถาวร</button><button class="btn gray" onclick="closeModal()">ยกเลิก</button></div>`);
    $('#dYes').onclick = async () => {
      const { error } = await sb.from('members').delete().eq('id', id);
      closeModal(); if(error) return toast('ลบไม่สำเร็จ'); toast('ลบแล้ว'); loadAll();
    };
  };
}
async function toggleMember(id){
  const m = S.members.find(x => x.id === id); if(!m) return;
  const { error } = await sb.from('members').update({ active: !m.active }).eq('id', id);
  if(error) return toast('บันทึกไม่สำเร็จ');
  toast(m.active ? 'ซ่อนแล้ว' : 'แสดงแล้ว'); loadAll();
}

/* ---------- ล็อกอิน ---------- */
async function login(){
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account', login_hint: CONFIG.ADMIN_EMAIL } }
  });
  if(error){ toast('ล็อกอินไม่ได้: ' + error.message); console.error(error); }
}
async function logout(){ await sb.auth.signOut(); S.user = null; toast('ออกจากระบบแล้ว'); setDate(todayKey()); }

/* ---------- สรุป / ส่งออก ---------- */
function summaryText(){
  const all = activeMembers();
  const inL = all.filter(m => S.checks[m.id]).sort((a,b) => String(S.checks[a.id].checked_at).localeCompare(String(S.checks[b.id].checked_at)));
  const outL = all.filter(m => !S.checks[m.id]);
  let s = `📋 ${S.eventName}\n🗓 ${thaiDate(S.date)}\n\n✅ มาแล้ว ${inL.length}/${all.length} คน\n`;
  inL.forEach((m,i) => s += `${i+1}. ${m.name} (${fmtTime(S.checks[m.id].checked_at)})\n`);
  s += `\n❌ ยังไม่มา ${outL.length} คน\n`;
  outL.forEach((m,i) => s += `${i+1}. ${m.name}${m.company ? ' - ' + m.company : ''}\n`);
  return s;
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ const a = document.createElement('textarea'); a.value = t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); let ok=false; try{ ok = document.execCommand('copy'); }catch(_){} a.remove(); return ok; }
}
function downloadCsv(){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['ลำดับ','คำนำหน้า','ชื่อ-นามสกุล','บริษัท/หน่วยงาน','สถานะ','เวลาเช็คชื่อ','วันที่']];
  activeMembers().forEach((m,i) => { const c = S.checks[m.id]; rows.push([i+1, m.title, m.name, m.company, c ? 'มาแล้ว' : 'ยังไม่มา', c ? fmtTimeSec(c.checked_at) : '', S.date]); });
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'เช็คชื่อ_' + S.date + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('ดาวน์โหลดไฟล์แล้ว (เปิดด้วย Excel ได้)');
}
function setDate(d){ S.date = d || todayKey(); loadAll(); }

/* ---------- เริ่มทำงาน ---------- */
(async function init(){
  if(!window.supabase){ setSync('err', 'โหลดไม่สำเร็จ'); $('#list').innerHTML = '<div class="card"><div class="note bad">โหลดระบบไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ</div></div>'; return; }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });

  const { data:{ session } } = await sb.auth.getSession();
  S.user = session ? session.user : null;
  sb.auth.onAuthStateChange((ev, sess) => {
    const was = isAdmin();
    S.user = sess ? sess.user : null;
    if(ev === 'SIGNED_IN' && !was){
      if(isAdmin()){ toast('ยินดีต้อนรับผู้ดูแล 👋'); $$('.tab')[2].click(); }
      else if(S.user) toast('บัญชีนี้ไม่มีสิทธิ์ผู้ดูแล');
    }
    render();
  });
  // ล้าง token ออกจากแถบที่อยู่หลังล็อกอิน
  if(location.hash.includes('access_token') || location.search.includes('code=')) history.replaceState(null, '', location.pathname);

  render();
  await loadAll();

  // อัปเดตแบบเรียลไทม์เมื่อมีคนเช็คชื่อ
  let reloadTimer;
  const soon = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(loadAll, 400); };
  sb.channel('live')
    .on('postgres_changes', { event:'*', schema:'public', table:'checkins' }, soon)
    .on('postgres_changes', { event:'*', schema:'public', table:'members' }, soon)
    .subscribe(st => { if(st === 'SUBSCRIBED') setSync('on', 'ออนไลน์ • สด'); });

  setInterval(() => { if(!document.hidden) loadAll(); }, 30000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ if(!isAdmin()) S.date = todayKey(); loadAll(); } });
})();
</script>
</body>
